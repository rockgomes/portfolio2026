name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.47.2-jammy
    env:
      CI: true
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Tests (functional, overlays, visual)
        run: npx playwright test
      - name: Save first-time screenshots as the approved baseline
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain tests/__screenshots__)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tests/__screenshots__
            git commit -m "Add approved screenshots from CI"
            git push
          fi
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
