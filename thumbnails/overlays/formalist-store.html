<!doctype html>
<!-- Formalist card: the Chrome Web Store listing on the top of the Shotkit picture, centred, where Rock placed it (Figma 571:10446).

<html><head><meta charset="utf-8"><style>
  @font-face { font-family: 'Geist'; src: url('geist.woff2') format('woff2'); font-weight: 100 900; }

  .listing { position: absolute; left: 50%; top: 78px; transform: translateX(-50%); display: flex; align-items: center; gap: 32px; padding: 36px; border-radius: 40px; background: #fff; white-space: nowrap;
